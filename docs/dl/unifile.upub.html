  <!--
    CSP: allow inbound fetches (for optional plugin assets like soundfonts) but
    block all form submissions and outbound data-exfiltration vectors.
    connect-src *  — XHR/fetch reads from any URL (e.g. soundfont CDN)

        + ' (Chrome\u00a080+, Firefox\u00a0113+, Safari\u00a016.4+, Edge\u00a080+).</div>';
      return;
    }
    var bytes = Uint8Array.from(atob(el.textContent.trim()), function (c) { return c.charCodeAt(0); });
    var ds    = new DecompressionStream('gzip');
    var w     = ds.writable.getWriter();
    w.write(bytes);
    w.close();
    new Response(ds.readable).text().then(function (code) {
      var s = document.createElement('script');
      s.textContent = code;
      document.head.appendChild(s);
    });
  }());
  </script>
