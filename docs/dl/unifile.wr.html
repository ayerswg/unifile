<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    CSP: allow inbound fetches (for optional plugin assets like soundfonts) but
    block all form submissions and outbound data-exfiltration vectors.
    connect-src *  — XHR/fetch reads from any URL (e.g. soundfont CDN)
    form-action 'none'  — no <form> can POST data anywhere
    All other directives remain locked down (no external scripts/frames/etc).
  -->

  <meta name="description" content="A self-contained document with full version history.">

n:0 auto;padding:28px 20px 20vh;font-family:Iowan Old Style,Charter,Georgia,Times New Roman,serif;font-size:17px;line-height:1.65;color:var(--fg)}.wr-prose h1,.wr-prose h2,.wr-prose h3,.wr-prose h4{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;line-height:1.25;margin:1.5em 0 .5em}.wr-prose h1{font-size:1.65em}.wr-prose h2{font-size:1.3em}.wr-prose h3{font-size:1.1em}.wr-prose p{margin:0 0 .9em}.wr-prose blockquote{margin:1em 0;padding:.1em 0 .1em 1em;border-left:3px solid var(--dim);color:var(--fg-mut)}.wr-prose code{font-family:ui-monospace,SF Mono,Menlo,monospace;font-size:.88em;background:var(--code-bg);border-radius:3px;padding:1px 4px}.wr-prose pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto}.wr-prose pre code{background:none;padding:0}.wr-prose ul,.wr-prose ol{padding-left:1.5em;margin:0 0 .9em}.wr-prose img{max-width:100%;border-radius:4px}.wr-prose hr{border:0;border-top:1px solid var(--line);margin:2em auto;width:50%}.wr-prose table{border-collapse:collapse;margin:1em 0;display:block;overflow-x:auto}.wr-prose th,.wr-prose td{border:1px solid var(--line);padding:5px 10px}.wr-prose a{color:var(--accent)}.wr-prose input[type=checkbox]{accent-color:var(--accent)}#wr-count{appearance:none;flex:none;border:0;background:transparent;color:var(--dim);font:500 12px/1 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:0 8px;height:42px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}#wr-slash{position:absolute;z-index:40;min-width:210px;max-width:min(300px,calc(100% - 16px));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #0000002e;padding:5px}#wr-slash[hidden]{display:none}#wr-slash button{appearance:none;display:flex;align-items:baseline;gap:10px;width:100%;border:0;background:transparent;color:var(--fg);text-align:left;font:400 15px/1.2 -
