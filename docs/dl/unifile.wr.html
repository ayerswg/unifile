<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    CSP: allow inbound fetches (for optional plugin assets like soundfonts) but
    block all form submissions and outbound data-exfiltration vectors.
    connect-src *  — XHR/fetch reads from any URL (e.g. soundfont CDN)
    form-action 'none'  — no <form> can POST data anywhere
    All other directives remain locked down (no external scripts/frames/etc).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src *; worker-src 'self' blob:; media-src blob: https:; frame-src 'none'; object-src 'none'; form-action 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Unifile</title>
  <meta name="description" content="A self-contained document with full version history.">
  <style>

ight-color:transparent}.wr-icon-btn:active{background:var(--bg-alt)}.wr-icon-btn.active{color:var(--accent)}#wr-main{flex:1;position:relative;min-height:0}#wr-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}#wr-sheet{max-width:70ch;margin:0 auto;padding:26px 18px 45vh}.wr-editor{outline:none;font-family:ui-monospace,SF Mono,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace;font-size:16px;line-height:1.7;color:var(--fg);caret-color:var(--accent);-webkit-tap-highlight-color:transparent;word-wrap:break-word}@media (min-width: 700px){.wr-editor{font-size:15px}}.wr-editor ::selection{background:color-mix(in srgb,var(--accent) 25%,transparent)}.wr-line{white-space:pre-wrap;overflow-wrap:break-word;padding-left:var(--hang, 0ch);text-indent:calc(-1 * var(--hang, 0ch));transition:transform .16s ease}.wr-line .md{color:var(--dim)}.wr-line .bullet{color:var(--fg-mut)}.t-h1,.t-h2,.t-h3,.t-h4,.t-h5,.t-h6{font-weight:700}.t-quote{color:var(--fg-mut);font-style:italic}.t-quote .md{font-style:normal}.t-fence,.t-code{background:var(--code-bg)}.t-hr{color:var(--dim);letter-spacing:.2em}.t-fm-fence,.t-fm{color:var(--fg-mut)}.t-fm .fm-key{color:var(--accent)}.wr-line code{background:var(--code-bg);border-radius:3px;padding:0 1px}.wr-line .lnk{color:var(--accent)}.wr-line .url,.wr-line s,.wr-line s .md{color:var(--dim)}.task-box{color:var(--fg-mut)}.task-box.task-done{color:var(--accent)}.task-done~.task-text,.task-text{color:var(--fg-mut)}.t-task .task-text{text-decoration:line-through;text-decoration-color:var(--dim)}.wr-focus .wr-line{transition:opacity .25s ease}.wr-focus .wr-away{opacity:.22}#wr-preview{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}.wr-prose{max-width:65ch;margin:0 auto;padding:28px 20px 20vh;font-family:Iowan Old Style,Charter,Georgia,Times New Roman,serif;font-size:17px;line-height:1.65;color:var(--fg)}.wr-prose h1,.wr-prose h2,.wr-prose h3,.wr-prose h4{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;line-height:1.25;margin:1.5em 0 .5em}.wr-prose h1{font-size:1.65em}.wr-prose h2{font-size:1.3em}.wr-prose h3{font-size:1.1em}.wr-prose p{margin:0 0 .9em}.wr-prose blockquote{margin:1em 0;padding:.1em 0 .1em 1em;border-left:3px solid var(--dim);color:var(--fg-mut)}.wr-prose code{font-family:ui-monospace,SF Mono,Menlo,monospace;font-size:.88em;background:var(--code-bg);border-radius:3px;padding:1px 4px}.wr-prose pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto}.wr-prose pre code{background:none;padding:0}.wr-prose ul,.wr-prose ol{padding-left:1.5em;margin:0 0 .9em}.wr-prose img{max-width:100%;border-radius:4px}.wr-prose hr{border:0;border-top:1px solid var(--line);margin:2em auto;width:50%}.wr-prose table{border-collapse:collapse;margin:1em 0;display:block;overflow-x:auto}.wr-prose th,.wr-prose td{border:1px solid var(--line);padding:5px 10px}.wr-prose a{color:var(--accent)}.wr-prose input[type=checkbox]{accent-color:var(--accent)}#wr-count{appearance:none;flex:none;border:0;background:transparent;color:var(--dim);font:500 12px/1 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:0 8px;height:42px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}#wr-slash{position:absolute;z-index:40;min-width:210px;max-width:min(300px,calc(100% - 16px));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #0000002e;padding:5px}#wr-slash[hidden]{display:none}#wr-slash button{appearance:none;display:flex;align-items:baseline;gap:10px;width:100%;border:0;background:transparent;color:var(--fg);text-align:left;font:400 15px/1.2 -apple-system,system-ui,sans-serif;padding:10px 12px;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}#wr-slash button.active,#wr-slash button:hover{background:var(--bg-alt)}#wr-slash .sl-label{flex:1}#wr-slash .sl-hint{flex:none;color:var(--dim);font:500 12px/1 ui-monospace,SF Mono,Menlo,monospace}#wr-overlay{position:absolute;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s ease}#wr-overlay.open{opacity:1}#wr-overlay[hidden]{display:none}#wr-modal{width:100%;max-width:560px;max-height:78%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg-elev);border-radius:14px 14px 0 0;box-shadow:0 -6px 40px #0003;padding-bottom:max(10px,env(safe-area-inset-bottom));transform:translateY(12px);transition:transform .18s ease}#wr-overlay.open #wr-modal{transform:translateY(0)}#wr-modal.tall{height:78%}@media (min-width: 700px){#wr-overlay{align-items:center}#wr-modal{border-radius:14px;max-height:84%}#wr-modal.tall{height:auto;min-height:60%}}.wr-sheet-head{position:sticky;top:0;background:var(--bg-elev);font:600 15px/1 -apple-system,system-ui,sans-serif;padding:18px 20px 12px;border-bottom:1px solid var(--line);z-index:1}.wr-sheet-body{padding:14px 20px 20px;font-size:15px}.wr-sheet-body.wr-prose{font-size:16px;padding-bottom:40px}.wr-menu{padding:8px 0 4px}.wr-menu button{appearance:none;display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--fg);font:400 16px/1.3 -apple-system,system-ui,sans-serif;padding:13px 22px;cursor:pointer;-webkit-tap-highlight-color:transparent}.wr-menu button:active{background:var(--bg-alt)}.wr-menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}.wr-menu-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pending);margin-left:6px;vertical-align:2px}.wr-mut{color:var(--fg-mut);font-size:13px}.wr-field{display:block;margin:0 0 16px;font-size:13px;color:var(--fg-mut)}.wr-field input,.wr-field select{display:block;width:100%;margin-top:6px;font-size:16px;color:var(--fg);background:var(--bg);border pple-system,system-ui,sans-serif;padding:11px 18px;border-radius:999px;box-shadow:0 4px 20px #00000040;opacity:0;transition:opacity .25s ease,transform .25s ease;z-index:60;max-width:86%;text-align:center}.wr-toast.show{opacity:1;transform:translate(-50%) translateY(0)}.wr-toast-action{background:var(--accent);color:#fff;cursor:pointer}.noscript-wrap{max-width:65ch;margin:0 auto;padding:30px 20px}

  <!--
    NO-JS FALLBACK
