# Unifile types — one entry per "product". Each drives a front-door hub page
# (_includes/launcher.html + assets/js/launch.js) that detects the device and
# routes the visitor to the right artifact, plus an overview of the type.
#
#   pwa      → installable Progressive Web App directory
#   download → standalone single-file .html

- id: markdown
  title: Unifile Markdown
  tagline: Markdown notes with built-in version history — fully offline.
  overview: >
    A dedicated Markdown editor in a single file that works with no server and
    no account, and keeps its own git-style version history.
  features:
    - Works 100% offline — no server, no account, no sync
    - Built-in git-style branches, commits, and history
    - Live preview with document / slides layouts
  pwa: /pwa-md/
  download: /dl/unifile.md.html

- id: mermaid
  title: Unifile Mermaid
  tagline: Diagrams as text — versioned, live, and offline.
  overview: >
    A dedicated Mermaid diagram editor with a live preview, in a single file
    that works with no server and no account, and keeps its own version history.
  features:
    - Works 100% offline — no server, no account, no sync
    - Live Mermaid preview (flowcharts, sequence, gantt, …)
    - Built-in git-style branches, commits, and history
  pwa: /pwa-mer/
  download: /dl/unifile.mer.html

- id: upub
  title: uPub
  tagline: A quiet Markdown writing app that exports real e-books — fully offline.
  overview: >
    A distraction-free writing app built for phones. Plain Markdown
    with dimmed syntax and true hanging list indents, git-style version history
    inside the document, and one-tap EPUB export for Apple Books, Kindle & Kobo.
  features:
    - Works 100% offline — no server, no account, no sync
    - EPUB 3 export — every "#" heading becomes a chapter
    - Built-in git-style commits, history and restore
  pwa: /pwa-upub/
  download: /dl/unifile.upub.html

- id: udraft
  title: uDraft
  tagline: Architectural blueprints from plain text — fully offline.
  overview: >
    A drafting app for floor plans. Describe rooms, doors, and windows in a
    readable text language and uDraft draws the blueprint — wall poché, door
    swings, dimension strings — with git-style version history inside the
    document and PDF export at true drawing scale.
  features:
    - Works 100% offline — no server, no account, no sync
    - Rooms in, blueprint out — walls, swings & dimensions drawn for you
    - PDF export at true scale (1/4" = 1'-0") + SVG/PNG
  pwa: /pwa-dft/
  download: /dl/unifile.dft.html

- id: abc
  title: ABC Notation
  tagline: Write music, hear it, route it — offline.
  overview: >
    A dedicated ABC notation editor with a bundled offline acoustic piano, a
    play/scrub transport, guitar/violin tablature, and live MIDI output so you
    can drive an external instrument such as Kontakt.
  features:
    - Offline acoustic piano (FluidR3) — bundled, no network
    - Transport with seekable progress + tablature
    - Route playback to an external MIDI port (Web MIDI)
  pwa: /pwa-abc/
  download: /dl/unifile.abc.html
