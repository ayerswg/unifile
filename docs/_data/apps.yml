# Navigable destinations, surfaced in the command bar and on /downloads/.
#
# The hub pages (kind: app) are the front door — each detects the device and
# routes to the right artifact (see _data/types.yml + _includes/launcher.html).
# The raw PWA/download URLs are kept directly reachable + searchable.
#   kind: app      → per-type front-door hub page
#   kind: download → a standalone single-file .html
#   kind: pwa      → an installable offline web app

# ── Front-door hubs (primary) ──
- title: Markdown
  url: /get/
  kind: app
  pinned: true
  excerpt: Markdown editor — overview, then install the app or download the file.

- title: Mermaid
  url: /mermaid/
  kind: app
  pinned: true
  excerpt: Mermaid diagram editor — overview, then install the app or download the file.

- title: ABC Notation
  url: /abc/
  kind: app
  pinned: true
  excerpt: ABC music notation — overview, then install the app or download the file.

# ── Direct links (searchable) ──
- title: Markdown — download (.html)
  url: /dl/unifile.md.html
  kind: download
  excerpt: Standalone single-file Markdown editor; save and open offline.

- title: Mermaid — download (.html)
  url: /dl/unifile.mer.html
  kind: download
  excerpt: Standalone single-file Mermaid diagram editor; save and open offline.

- title: ABC Notation — download (.html)
  url: /dl/unifile.abc.html
  kind: download
  excerpt: Standalone ABC build with offline piano + MIDI.

- title: Markdown — install (PWA)
  url: /pwa-md/
  kind: pwa
  excerpt: Install the Markdown editor as an offline app.

- title: Mermaid — install (PWA)
  url: /pwa-mer/
  kind: pwa
  excerpt: Install the Mermaid diagram editor as an offline app.

- title: ABC Notation — install (PWA)
  url: /pwa-abc/
  kind: pwa
  excerpt: Install the ABC notation app as an offline app.
