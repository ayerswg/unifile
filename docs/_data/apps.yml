# Navigable destinations, surfaced in the command bar and on /downloads/.
#
# The hub pages (kind: app) are the front door — each detects the device and
# routes to the right artifact (see _data/types.yml + _includes/launcher.html).
# The raw PWA/download URLs are kept directly reachable + searchable.
#   kind: app      → per-type front-door hub page
#   kind: download → a standalone single-file .html
#   kind: pwa      → an installable offline web app

# ── Front-door hubs (primary) ──
- title: "{document}"
  url: /get/
  kind: app
  pinned: true
  excerpt: Markdown editor — overview, then install the app or download the file.

- title: "{diagram}"
  url: /mermaid/
  kind: app
  pinned: true
  excerpt: Mermaid diagram editor — overview, then install the app or download the file.

- title: "{compose}"
  url: /abc/
  kind: app
  pinned: true
  excerpt: ABC music notation — overview, then install the app or download the file.

- title: "{write}"
  url: /upub/
  kind: app
  pinned: true
  excerpt: Distraction-free Markdown writing with EPUB export — install or download.

- title: "{draft}"
  url: /udraft/
  kind: app
  pinned: true
  excerpt: Architectural blueprints from plain text — install or download.

- title: "{slides}"
  url: /slides/
  kind: app
  pinned: true
  excerpt: Marp-style slide decks from Markdown with PDF/HTML export — install or download.

- title: "{sheet}"
  url: /sheet/
  kind: app
  pinned: true
  excerpt: A spreadsheet written as Markdown tables — formulas, merged cells, .xlsx export — install or download.

