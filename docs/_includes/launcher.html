{% assign t = site.data.types | where: "id", page.type | first %}
<div class="launcher">
  <p class="launch-tagline">{{ t.tagline }}</p>

  <div id="launch" class="launch-actions"
       data-pwa="{{ t.pwa | relative_url }}"
       data-download="{{ t.download | relative_url }}"
       data-title="{{ t.title }}">
    <!-- Populated by launch.js based on device; these are the no-JS fallback. -->
    <a class="launch-btn primary" href="{{ t.pwa | relative_url }}">Open / install the app</a>
    <a class="launch-btn" href="{{ t.download | relative_url }}" download>Download single .html</a>
  </div>

  <div class="launch-overview">
    <p>{{ t.overview }}</p>
    <ul class="launch-features">
      {% for f in t.features %}<li>{{ f }}</li>{% endfor %}
    </ul>
  </div>
</div>
<script src="{{ '/assets/js/launch.js' | relative_url }}" defer></script>
